name: Bug report
description: Report a problem
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: describe_the_bug
    attributes:
      label: What happened
      description: Short description of the bug.
    validations:
      required: true

  - type: textarea
    id: to_reproduce
    attributes:
      label: Steps
      description: How to reproduce it.
      placeholder: |
        1. Open menu
        2. Go to ...
        3. Error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: Log
      description: Optional. Set log level to 3 in spaceConfig.ini and paste SpaceLog.txt.
      placeholder: Paste SpaceLog.txt here...
      render: text
    validations:
      required: false
